[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boundarybench"
version = "0.1.0"
description = "LLM BoundaryBench — a reproducible AI/LLM trust-boundary security evaluation framework"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Joseph Flores", email = "joseph.r.flores.17@outlook.com" }]
keywords = ["llm", "security", "red-teaming", "prompt-injection", "pyrit", "trust-boundary"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
pyrit = ["pyrit==1.2.0"]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
boundarybench = "boundarybench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/boundarybench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]
